<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OG card EL TIO (herramienta interna, no enlazar)</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#04070B;position:relative;font-family:'Geist',sans-serif}
.photo{
  position:absolute;top:0;right:0;width:640px;height:630px;
  background-image:url('assets/tio-1.webp');
  background-size:cover;background-position:62% 20%;
}
.fade{
  position:absolute;inset:0;
  background:linear-gradient(90deg,#04070B 0%,#04070B 40%,rgba(4,7,11,.55) 58%,rgba(4,7,11,.05) 100%);
}
.copy{position:absolute;left:72px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center;z-index:2}
.eyebrow{
  font-family:'Geist Mono',monospace;font-size:15px;letter-spacing:.34em;
  color:#7FC9F2;margin-bottom:26px;
}
h1{
  font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 125;
  font-weight:900;font-size:120px;line-height:.96;letter-spacing:-.01em;
  color:#EDF1F4;text-transform:uppercase;
}
h1 .dot{color:#7FC9F2}
.sub{
  margin-top:26px;font-size:24px;font-weight:300;color:rgba(237,241,244,.85);max-width:480px;line-height:1.45;
}
.tags{display:flex;gap:14px;margin-top:34px}
.tag{
  font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:.2em;
  color:#7FC9F2;border:1px solid rgba(127,201,242,.35);border-radius:100px;
  padding:9px 18px;
}
.line{position:absolute;left:0;top:0;width:100%;height:5px;background:#7FC9F2;z-index:3}
</style>
</head>
<body>
<div class="photo"></div>
<div class="fade"></div>
<div class="line"></div>
<div class="copy">
  <p class="eyebrow">INTELIGENCIA ARTIFICIAL PARA EMPRESAS</p>
  <h1>EL TIO<span class="dot">.</span></h1>
  <p class="sub">IA que funciona, con resultados reales. Funcionando en 48 horas.</p>
  <div class="tags">
    <span class="tag">AUTOMATIZACIÓN</span>
    <span class="tag">OPTIMIZACIÓN</span>
    <span class="tag">CAPACITACIÓN</span>
  </div>
</div>
</body>
</html>
